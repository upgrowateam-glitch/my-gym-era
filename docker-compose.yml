# FitZone on the VPS: website, API server and its own PostgreSQL database.
#
#   https://<DOMAIN>  ->  Traefik (shared front door, HTTPS)  ->  fitzone-web
#                                                                   │ /api, /socket.io, /uploads
#                                                                   ▼
#                                                     fitzone-api ──► fitzone-db
#
# Separate from every other project on the server:
#   - fitzone-api and fitzone-db live only on FitZone's private network
#     ("fitzone"); the database and server are NOT reachable from outside
#   - only fitzone-web is linked to Traefik, which gives it HTTPS
#   - no ports are opened on the VPS
#
# Settings and secrets come from the .env file next to this file (see .env.example).
#
#   docker compose up -d --build     start / update
#   docker compose logs -f api       watch the server log
#   docker compose down              stop (data is kept)

name: fitzone

services:
  db:
    image: postgres:18-alpine
    container_name: fitzone-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: mygymera_prod
      POSTGRES_USER: mygymera_app
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the .env file}
    volumes:
      - fitzone-db-data:/var/lib/postgresql
    networks:
      - fitzone
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mygymera_app -d mygymera_prod"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    container_name: fitzone-api
    restart: unless-stopped
    init: true
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 4000
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: mygymera_prod
      PGUSER: mygymera_app
      PGPASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the .env file}
      JWT_EXPIRES_IN: 7d
      UPLOAD_DIR: uploads
      PUBLIC_BASE_URL: https://${DOMAIN:?Set DOMAIN in the .env file}
    volumes:
      - fitzone-uploads:/app/uploads
    networks:
      - fitzone

  web:
    build:
      context: ./mobile
      args:
        EXPO_PUBLIC_API_URL: https://${DOMAIN}
    container_name: fitzone-web
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - fitzone
      - traefik
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:?Set TRAEFIK_NETWORK in the .env file}
      - traefik.http.routers.fitzone.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.fitzone.entrypoints=websecure
      - traefik.http.routers.fitzone.tls.certresolver=letsencrypt
      - traefik.http.services.fitzone.loadbalancer.server.port=80

networks:
  fitzone:
    name: fitzone
  # Traefik's existing network (only fitzone-web joins it).
  traefik:
    name: ${TRAEFIK_NETWORK}
    external: true

volumes:
  fitzone-db-data:
    name: fitzone-db-data
  fitzone-uploads:
    name: fitzone-uploads
