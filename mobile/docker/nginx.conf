# Serves the FitZone website (inside the fitzone-web container) and passes
# server requests (/api, /socket.io, /uploads) on to the fitzone-api container,
# so the whole app works from one address (https://fitzone.upgrowa.cloud).
server {
    listen 80;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Largest upload the server accepts (media videos: 200 MB).
    client_max_body_size 210m;

    # ── Server (fitzone-api) ─────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://api:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
        proxy_request_buffering off;
    }

    location /uploads/ {
        proxy_pass http://api:4000;
        proxy_set_header Host $host;
    }

    # Live chat connection (WebSocket).
    location /socket.io/ {
        proxy_pass http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # ── Website ──────────────────────────────────────────────────────────────
    # Built files have unique names, so browsers may keep them for a long time.
    location /_expo/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Every page (e.g. /login, /super-admin) is handled by the app itself.
    location / {
        try_files $uri $uri.html $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
